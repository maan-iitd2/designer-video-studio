<!doctype html>
<html data-composition-id="showreel-study" data-composition-duration="2" data-composition-variables='[{"id":"scene","type":"string","default":"Signal"},{"id":"text","type":"string","default":""},{"id":"caption","type":"string","default":""},{"id":"ink","type":"string","default":"#f2efe7"}]'>
<head><meta charset="utf-8"></head><body><template>
<div id="root" data-composition-id="showreel-study" data-duration="2" style="width:100%;height:100%;overflow:hidden">
<canvas width="1920" height="1080" style="width:100%;height:100%;display:block"></canvas>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(()=>{
  const root=document.getElementById("root"), cx=root.querySelector("canvas").getContext("2d");
  const {scene,text,caption,ink}=window.__hyperframes.getVariables();
  const css=getComputedStyle(root), bg=css.getPropertyValue("--bg").trim()||"#0f0f11";
  const accent=css.getPropertyValue("--brand").trim()||"#f04b3a";
  const black="#0f0f11",cream="#f2efe7",red="#f04b3a",blue="#302ff7",tau=2*Math.PI;
  const clamp=x=>Math.min(1,Math.max(0,x)), ease=x=>1-(1-clamp(x))**3;
  const mix=(a,b,p)=>a+(b-a)*p;
  function dot(x,y,r,color){cx.fillStyle=color;cx.beginPath();cx.arc(x,y,Math.max(.1,r),0,tau);cx.fill()}
  function ring(x,y,r,color,weight=1){cx.strokeStyle=color;cx.lineWidth=weight;cx.beginPath();cx.arc(x,y,Math.max(.1,r),0,tau);cx.stroke()}
  function line(x,y,xx,yy,color,w=1){cx.strokeStyle=color;cx.lineWidth=w;cx.beginPath();cx.moveTo(x,y);cx.lineTo(xx,yy);cx.stroke()}
  function label(str,x,y,size,color,font="monospace"){
    cx.fillStyle=color;cx.font=size+"px "+font;cx.textAlign="left";cx.textBaseline="middle";cx.fillText(str,x,y)
  }
  function poster(str,x,y,width,capHeight,color,outline=false){
    if(!str)return;
    cx.save();cx.font='1000 240px "Arial Black",Arial,sans-serif';cx.textBaseline="alphabetic";cx.textAlign="center";
    const m=cx.measureText(str), h=m.actualBoundingBoxAscent||175;
    cx.translate(x,y);cx.scale(width/Math.max(1,m.width),capHeight/h);
    if(outline){cx.strokeStyle=color;cx.lineWidth=1.4;cx.strokeText(str,0,h/2)}
    else{cx.fillStyle=color;cx.fillText(str,0,h/2)}cx.restore()
  }
  function notation(p){
    cx.save();cx.globalAlpha=.6;
    const color=[black,blue].includes(bg)?cream:black;
    for(const [x,y,sx,sy] of [[32,32,1,1],[1888,32,-1,1],[32,1048,1,-1],[1888,1048,-1,-1]]){
      line(x,y,x+sx*40,y,color,1);line(x,y,x,y+sy*32,color,1)
    }
    label("CLAUDE    MOTION REEL — 2026",74,60,12,color);
    label(scene.toUpperCase(),1608,60,12,color);
    line(70,1004,520,1004,color);line(1420,1004,1850,1004,color);
    label("MOTION  /  FORM STUDIES",74,1026,11,color);
    label(("00"+Math.floor(p*99)).slice(-2)+"   /   INDEX",1730,1026,11,color);cx.restore()
  }
  function burst(x,y,r,p,color,angle=0){
    cx.save();cx.translate(x,y);cx.rotate(angle);
    for(let i=0;i<12;i++){const a=i*tau/12;cx.lineCap="round";
      const reach=r*ease(p*2-i*.065)*(1+.08*Math.sin(i*8));
      line(0,0,Math.sin(a)*reach,-Math.cos(a)*reach,color,Math.max(2,r*.15*clamp(p*1.6)))}
    cx.restore()
  }
  function signal(p){
    const exit=1-ease((p-.82)/.14),r=240*ease((p-.07)/.62)*exit;
    cx.save();cx.globalAlpha=.45*(1-p);ring(960,540,680*ease(p*1.5),ink,1);cx.restore();
    for(let i=0;i<84;i++){const a=i*tau/84;dot(960+Math.cos(a)*313,540+Math.sin(a)*313,1.4,ink)}
    dot(960,540,Math.max(2,33*(1-p)*exit),accent);burst(960,540,r,p,accent,.12*Math.sin(p*4))
  }
  function identity(p,closing){
    if(closing){
      const spread=ease((p-.19)/.32);
      burst(960-487*spread,540,162-58*spread,1,ink,p<.2?p*1.4:.28);
      if(spread>.003)poster(text,1020+42*spread,540,1100*spread,154*spread,ink);
      cx.save();cx.font="italic "+(65*Math.max(.01,spread))+"px Georgia";cx.fillStyle=ink;cx.fillText(caption,510,720);cx.restore();
    }else{
      const v=ease(p*6),out=clamp((p-.9)/.1);
      cx.save();cx.beginPath();cx.rect(0,240,1920,660);cx.clip();
      const letters=Array.from(text);let weights=letters.map((_,i)=>1+.34*Math.sin(i*2.1+p*9));
      const sum=weights.reduce((a,b)=>a+b,0);let x=125;
      for(const [i,c] of letters.entries()){const w=1670*weights[i]/sum;
        poster(c,x+w/2,525+out*110*Math.sin(i*3.2),w*.95,(130+142*v)*(1+.14*Math.sin(p*8+i))*(1-out*.45),ink);x+=w}
      cx.restore();if(p>.42){cx.save();cx.globalAlpha=ease((p-.42)/.2);cx.font='italic 80px Georgia';cx.fillStyle=cream;cx.textAlign="center";cx.textBaseline="middle";cx.fillText(caption,960,740);cx.restore()}
    }
  }
  function chart(p){
    const labels=["LINEAR","ACCELERATE","DECELERATE","SINE IN / OUT","OVERSHOOT","BOUNCE"];
    const funcs=[x=>x,x=>x*x,x=>1-(1-x)**2,x=>(1-Math.cos(x*Math.PI))/2,x=>x+.25*Math.sin(x*Math.PI*2),x=>1-Math.abs(Math.cos(x*4.71))*(1-x)];
    const dissolve=ease((p-.82)/.17);cx.save();cx.globalAlpha=1-dissolve;
    label(text,144,187,52,ink,"Georgia,serif");const t=clamp((p-.25)/.54);
    labels.forEach((name,i)=>{const y=328+i*88,start=662,end=1676;
      line(start,y,end,y,"#d6d1c7",2);label("0"+(i+1)+"   "+name,145,y,17,ink);
      cx.beginPath();for(let j=0;j<=20;j++){const x=j/20,cy=y+16-32*funcs[i](x);if(j===0)cx.moveTo(460,cy);else cx.lineTo(460+x*34,cy)}cx.strokeStyle=ink;cx.lineWidth=2;cx.stroke();
      const col=[ink,blue,accent][i%3];const x=mix(start,end,funcs[i](t)),intro=ease(p*6);
      dot(mix(556+i*50,x,intro),mix(370+i*23,y,intro),20,col)
    });cx.restore();
    if(dissolve>0){for(let i=0;i<6;i++){cx.globalAlpha=1-dissolve;dot(mix(1676,960,dissolve),mix(328+i*88,540,dissolve),20,[ink,blue,accent][i%3])}
      cx.globalAlpha=1;dot(960,540,80*dissolve,blue)}
  }
  // Interpolate radial distances so the silhouettes morph together at their vertices.
  function radius(theta,n,star){
    if(!n)return 1;
    const edges=star?n*2:n, step=tau/edges, q=(theta%tau+tau)%tau;
    const i=Math.floor(q/step),a=q-i*step,r1=star&&i%2?.43:1,r2=star&&(i+1)%2?.43:1;
    return r1*r2*Math.sin(step)/(r2*Math.sin(step-a)+r1*Math.sin(a))
  }
  function morph(p){
    const pos=Math.min(2.999,clamp((p-.19)/.78)*3),i=Math.floor(pos),t=ease(pos-i),forms=[0,3,5,4];
    function shape(x,y,r){cx.beginPath();for(let k=0;k<=180;k++){const a=k*tau/180;
      const d=r*mix(radius(a,forms[i],i===2),radius(a,forms[i+1],i+1===2),t);
      const angle=a-1.57+.2*Math.sin(p*8)+Math.PI/4*clamp(pos-2);const xx=x+Math.cos(angle)*d,yy=y+Math.sin(angle)*d;
      if(k)cx.lineTo(xx,yy);else cx.moveTo(xx,yy)}cx.closePath();cx.fillStyle=ink;cx.fill()}
    shape(960,540,220);for(let j=0;j<12;j++){const a=j*tau/12+p*.9;shape(960+Math.cos(a)*380,540+Math.sin(a)*380,23*(1-clamp((p-.84)/.16)))}
  }
  function tiles(p){
    const open=ease((p-.04)*7);cx.save();cx.translate(960,540);cx.scale(.16+.84*open,.16+.84*open);
    if(p<.06){cx.fillStyle=ink;cx.fillRect(-900,-900,1800,1800);cx.fillStyle=bg;cx.fillRect(-340,-340,680,680);cx.restore();return}
    const size=106;cx.lineWidth=13;cx.lineCap="round";
    for(let i=-11;i<=10;i++)for(let j=-7;j<=6;j++){
      const x=i*size,y=j*size,seed=Math.sin(i*183.1+j*65.9)*43758.5;
      const flip=seed-Math.floor(seed)>.5;const wave=p<.21?1:Math.sin(i*.42+j*.17-p*13);
      cx.strokeStyle=wave>.03?ink:accent;const gap=wave>.03?0:.18;
      for(const [dx,dy,start] of (flip?[[0,0,0],[1,1,Math.PI]]:[[1,0,Math.PI/2],[0,1,-Math.PI/2]])){
        cx.beginPath();cx.arc(x+dx*size,y+dy*size,size*.5,start+gap,start+Math.PI/2-gap);cx.stroke()}
    }cx.restore()
  }
  function cloud(p){
    const bend=ease((p-.09)/.42), don=ease((p-.54)/.36);
    for(let lat=0;lat<31;lat++)for(let lon=0;lon<61;lon++){
      const u=lon/60*tau,v=lat/30*Math.PI;
      const major=mix(319*Math.sin(v),204+90*Math.cos(v*2),don);
      const xx=major*Math.cos(u+p*2.4),zz=major*Math.sin(u+p*2.4);
      const yy=mix(325*Math.cos(v),105*Math.sin(v*2),don);
      const tilt=.34+p*.25;
      const x=mix((lon-30)*28,xx,bend),y=mix((lat-15)*13+80,yy*Math.cos(tilt)-zz*Math.sin(tilt),bend);
      cx.globalAlpha=.23+.59*(zz/670+.5);dot(960+x,540+y,bend*(1.3+.9*(zz/670+.5))+.6,ink)
    }cx.globalAlpha=1
  }
  function type(p){
    const repeat=scene==="Type echo",h=scene==="Condensed type"?730:scene==="Full stop"?222:scene==="Punch in"?445:repeat?248:370;
    if(repeat && p>.42){for(let row=-3;row<=3;row++){if(row===0)continue;
      for(let col=-1;col<=1;col++)poster(text,960+col*1440+(row%2)*200,540+row*222,1390,188,ink,true)}}
    const period=text.endsWith("."),width=scene==="Punch in"?1120:scene==="Full stop"?1375:1760;
    poster(period?text.slice(0,-1):text,period?910:960,540,period?width*.83:width,h*(.88+.12*ease(p*5)),ink);
    if(period)dot(940+width*.43,540+h*.38,Math.min(68,h*.15),accent);
  }
  const state={p:0};
  function draw(){
    const p=state.p;cx.save();cx.fillStyle=bg;cx.fillRect(0,0,1920,1080);
    switch(scene){case "Signal":signal(p);break;case "Wordmark":identity(p,false);break;
    case "Easing chart":chart(p);break;case "Shape morph":morph(p);break;case "Truchet tiles":tiles(p);break;
    case "Point cloud":cloud(p);break;case "End card":identity(p,true);break;default:type(p)}
    notation(p);cx.restore()
  }
  const duration=Number("__STUDIO_SHOT_SECONDS__")||Number(root.dataset.duration)||2;
  const tl=gsap.timeline({paused:true}).to(state,{p:1,duration,ease:"none",onUpdate:draw},0);
  draw();window.__timelines=window.__timelines||{};window.__timelines["showreel-study"]=tl;
})();
</script></div></template></body></html>
