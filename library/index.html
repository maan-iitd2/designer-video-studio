<!doctype html>
<html lang="en" data-source-base="">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shot library · Designer Video Studio</title>
<link rel="stylesheet" href="gallery.css">
<main>
  <header><h1>Shot library<span>.</span></h1><p>Choose a shot and copy its ID into your video brief.</p>
    <nav aria-label="Studio resources"><a href="https://github.com/maan-iitd2/designer-video-studio">Get the studio on GitHub</a><a href="https://github.com/maan-iitd2/designer-video-studio#tools-and-sources">Tools and sources</a></nav>
  </header>
  <form id="filters" role="search">
    <label>Search shots<input type="search" id="query" placeholder="Try paper, zoom, chart, captions…" autocomplete="off"></label>
    <label>Collection<select id="collection"><option value="">All collections</option></select></label>
    <label>Preview<select id="type"><option value="">All entries</option><option value="video">Local video</option><option value="poster">Local still</option></select></label>
  </form>
  <div class="results"><p id="count" aria-live="polite"></p><button type="button" id="reset">Reset filters</button></div>
  <section id="grid" aria-label="Matching shots"></section>
  <button id="more" type="button">Show more shots</button>
  <noscript>Enable JavaScript to browse the catalog, or use find.py to search by keyword.</noscript>
</main>
<dialog id="detail" aria-labelledby="name">
  <div class="toolbar"><span id="family"></span><button type="button" id="close">Close</button></div>
  <div id="art"></div>
  <div class="body"><h2 id="name"></h2><p id="description"></p>
    <label>Shot ID<input id="shotId" readonly></label><button type="button" id="copy">Copy ID</button>
    <p id="feedback" role="status"></p><p id="sourcePath"></p><nav id="links"></nav>
  </div>
</dialog>
<script src="catalog.js"></script>
<script src="gallery.js"></script>
</html>
