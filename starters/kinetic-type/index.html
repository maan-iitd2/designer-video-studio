<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Kinetic Type</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0a0a0f;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <!-- Adapted for Designer Video Studio. The sample uses a silent colour field.
           A project can replace this layer with its own photo or footage. -->
      <div id="backdrop" aria-hidden="true"
        style="position:absolute;inset:0;background:radial-gradient(ellipse at 28% 68%, #27465b, #101725 65%);opacity:0">
      </div>
      <div
        id="graphics-layer"
        data-composition-id="main-graphics"
        data-composition-src="compositions/main-graphics.html"
        data-start="0"
        data-duration="15"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; z-index: 1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Keep these backdrop cues aligned with the graphic scene boundaries.
      tl.set("#backdrop", { opacity: 0 }, 0);
      tl.set("#backdrop", { opacity: 1 }, 2.2); // reveal after the Scene 1 white wipe
      tl.to("#backdrop", { opacity: 0, duration: 0.4 }, 11.7); // hide for the Wes Anderson scene
      tl.set("#backdrop", { opacity: 1 }, 13.5); // back for the Vignelli outro

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
